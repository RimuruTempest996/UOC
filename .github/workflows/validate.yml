name: Validar UOC

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar archivos principales
        run: |
          test -s index.html
          test -s src/app.js
          test -s src/styles.css
          test -s README.md
